# ThreeModelHub Nginx 站点配置
# 部署到 /etc/nginx/sites-available/threemode，然后软链到 sites-enabled/
#
# 文件上传：ThreeModelHub 自带 MinIO + 后端分片上传，
# 不依赖任何外部文件服务。所有文件通过 /api/upload 走本服务。

upstream threemodelhub_backend {
    server 127.0.0.1:3000;
    keepalive 64;
}

# HTTP -> HTTPS 跳转（有域名和 SSL 证书后启用）
# server {
#     listen 80;
#     server_name your-domain.com www.your-domain.com;
#     return 301 https://$host$request_uri;
# }

# 没有域名/SSL 时，直接用 HTTP
server {
    listen 80;
    server_name _;

    # 前端静态文件
    root /opt/threemodelhub/frontend/dist;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # Vite 构建产物的哈希文件名，长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # API 反向代理
    location /api/ {
        proxy_pass http://threemodelhub_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # 文件上传超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # 上传大小限制（默认 1GB，可在 backend MAX_UPLOAD_SIZE_MB 调整）
        client_max_body_size 1024m;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

