# ThreeModelHub 全栈本地部署
# 使用: docker compose -f docker-compose.deploy.yml up -d --build
# 访问: http://localhost:8080
#
# 文件上传：内置 MinIO 服务，不依赖任何外部文件服务。

services:
  mysql:
    image: mysql:8.0
    container_name: threemodelhub_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-three_model_hub}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-3308}:3306"
    volumes:
      - threemodelhub_mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - threemodelhub-net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: threemodelhub_backend
    restart: unless-stopped
    environment:
      NODE_ENV: development  # 首次启动需要 synchronize 创建表
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_DATABASE: ${DB_DATABASE:-three_model_hub}
      DB_LOGGING: "false"
      PORT: 3000
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - threemodelhub-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/models"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: threemodelhub_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    networks:
      - threemodelhub-net

networks:
  threemodelhub-net:
    driver: bridge

volumes:
  threemodelhub_mysql_data:
