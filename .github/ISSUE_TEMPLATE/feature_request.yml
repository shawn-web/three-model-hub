name: 功能建议
description: 提议新功能或改进
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      content: |
        感谢你提出功能建议！请清晰描述需求和使用场景。

  - type: textarea
    id: problem
    attributes:
      label: 你要解决什么问题？
      description: 描述当前痛点或使用场景
      placeholder: |
        现有的 GLB 上传没有进度条，大文件（>500MB）上传时用户看不到进度，体验较差
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你期望的解决方案
      description: 描述你希望的功能行为
      placeholder: |
        上传时显示实时进度条（百分比 + 速度 + 剩余时间），并支持取消
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你考虑过的其他方案及其利弊
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 截图、相关链接、参考实现等
    validations:
      required: false
