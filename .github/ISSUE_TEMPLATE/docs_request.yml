name: 文档问题
description: 报告文档错误、缺失或不清楚的地方
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: textarea
    id: what
    attributes:
      label: 文档哪里有问题？
      description: 哪份文档的哪一部分
      placeholder: |
        docs/deployment.md 中 "数据库同步" 章节的 `pnpm migration:run` 命令未说明在哪个目录执行
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 应该如何描述？
      description: 你建议的修改内容
    validations:
      required: true
