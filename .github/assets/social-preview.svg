<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" preserveAspectRatio="xMidYMid meet" role="img" aria-label="ThreeModelHub social preview">
  <title>ThreeModelHub - 3D 模型管理与场景平台</title>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="cube-top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="cube-left" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="cube-right" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="hub-yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1280" height="640" fill="url(#bg-grad)"/>

  <!-- 装饰：背景点阵（暗示网格/拓扑） -->
  <g opacity="0.15" fill="#38BDF8">
    <circle cx="100" cy="100" r="2"/>
    <circle cx="200" cy="100" r="2"/>
    <circle cx="300" cy="100" r="2"/>
    <circle cx="400" cy="100" r="2"/>
    <circle cx="500" cy="100" r="2"/>
    <circle cx="100" cy="200" r="2"/>
    <circle cx="200" cy="200" r="2"/>
    <circle cx="300" cy="200" r="2"/>
    <circle cx="100" cy="300" r="2"/>
    <circle cx="200" cy="300" r="2"/>
    <circle cx="100" cy="400" r="2"/>
    <circle cx="1100" cy="200" r="2"/>
    <circle cx="1200" cy="200" r="2"/>
    <circle cx="1100" cy="300" r="2"/>
    <circle cx="1200" cy="300" r="2"/>
    <circle cx="1100" cy="400" r="2"/>
    <circle cx="1200" cy="400" r="2"/>
    <circle cx="1000" cy="500" r="2"/>
    <circle cx="1100" cy="500" r="2"/>
    <circle cx="200" cy="500" r="2"/>
  </g>

  <!-- 左侧：Logo 立方体放大版 -->
  <g transform="translate(280 320) scale(1.7)">
    <polygon points="0,-60 52,-30 0,0 -52,-30" fill="url(#cube-top)" stroke="#7DD3FC" stroke-width="1.5"/>
    <polygon points="-52,-30 0,0 0,60 -52,30" fill="url(#cube-left)" stroke="#7DD3FC" stroke-width="1.5"/>
    <polygon points="52,-30 0,0 0,60 52,30" fill="url(#cube-right)" stroke="#7DD3FC" stroke-width="1.5"/>
  </g>

  <!-- Logo 周围的 6 个小立方体（Hub 卫星） -->
  <g transform="translate(280 130)">
    <polygon points="0,-22 19,-11 0,0 -19,-11" fill="url(#hub-yellow)" stroke="#92400E" stroke-width="1.5"/>
    <polygon points="-19,-11 0,0 0,22 -19,11" fill="#D97706" stroke="#92400E" stroke-width="1.5"/>
    <polygon points="19,-11 0,0 0,22 19,11" fill="#F59E0B" stroke="#92400E" stroke-width="1.5"/>
  </g>
  <g transform="translate(490 230)">
    <polygon points="0,-22 19,-11 0,0 -19,-11" fill="url(#hub-yellow)" stroke="#92400E" stroke-width="1.5"/>
    <polygon points="-19,-11 0,0 0,22 -19,11" fill="#D97706" stroke="#92400E" stroke-width="1.5"/>
    <polygon points="19,-11 0,0 0,22 19,11" fill="#F59E0B" stroke="#92400E" stroke-width="1.5"/>
  </g>
  <g transform="translate(490 410)">
    <polygon points="0,-22 19,-11 0,0 -19,-11" fill="url(#hub-yellow)" stroke="#92400E" stroke-width="1.5"/>
    <polygon points="-19,-11 0,0 0,22 -19,11" fill="#D97706" stroke="#92400E" stroke-width="1.5"/>
    <polygon points="19,-11 0,0 0,22 19,11" fill="#F59E0B" stroke="#92400E" stroke-width="1.5"/>
  </g>
  <g transform="translate(280 510)">
    <polygon points="0,-22 19,-11 0,0 -19,-11" fill="url(#hub-yellow)" stroke="#92400E" stroke-width="1.5"/>
    <polygon points="-19,-11 0,0 0,22 -19,11" fill="#D97706" stroke="#92400E" stroke-width="1.5"/>
    <polygon points="19,-11 0,0 0,22 19,11" fill="#F59E0B" stroke="#92400E" stroke-width="1.5"/>
  </g>
  <g transform="translate(70 410)">
    <polygon points="0,-22 19,-11 0,0 -19,-11" fill="url(#hub-yellow)" stroke="#92400E" stroke-width="1.5"/>
    <polygon points="-19,-11 0,0 0,22 -19,11" fill="#D97706" stroke="#92400E" stroke-width="1.5"/>
    <polygon points="19,-11 0,0 0,22 19,11" fill="#F59E0B" stroke="#92400E" stroke-width="1.5"/>
  </g>
  <g transform="translate(70 230)">
    <polygon points="0,-22 19,-11 0,0 -19,-11" fill="url(#hub-yellow)" stroke="#92400E" stroke-width="1.5"/>
    <polygon points="-19,-11 0,0 0,22 -19,11" fill="#D97706" stroke="#92400E" stroke-width="1.5"/>
    <polygon points="19,-11 0,0 0,22 19,11" fill="#F59E0B" stroke="#92400E" stroke-width="1.5"/>
  </g>

  <!-- 右侧：项目文字（位置往左挪，确保完整显示） -->
  <g>
    <text x="600" y="260" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="68" font-weight="800" fill="#F8FAFC" letter-spacing="-1">ThreeModelHub</text>
    <text x="600" y="320" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="26" font-weight="500" fill="#7DD3FC" letter-spacing="0.5">3D 模型管理 · 场景编辑 · Geo 地理</text>
    <text x="600" y="365" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="400" fill="#94A3B8">GLB/GLTF · Three.js · Cesium · NestJS · MySQL · MinIO</text>

    <!-- 标签条 -->
    <g transform="translate(600 420)">
      <rect x="0" y="0" width="100" height="32" rx="16" fill="#0EA5E9" fill-opacity="0.2" stroke="#38BDF8" stroke-width="1"/>
      <text x="50" y="22" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#7DD3FC" text-anchor="middle">MIT License</text>

      <rect x="115" y="0" width="100" height="32" rx="16" fill="#0EA5E9" fill-opacity="0.2" stroke="#38BDF8" stroke-width="1"/>
      <text x="165" y="22" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#7DD3FC" text-anchor="middle">Self-Hosted</text>

      <rect x="230" y="0" width="100" height="32" rx="16" fill="#0EA5E9" fill-opacity="0.2" stroke="#38BDF8" stroke-width="1"/>
      <text x="280" y="22" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#7DD3FC" text-anchor="middle">TypeScript</text>

      <rect x="345" y="0" width="100" height="32" rx="16" fill="#0EA5E9" fill-opacity="0.2" stroke="#38BDF8" stroke-width="1"/>
      <text x="395" y="22" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#7DD3FC" text-anchor="middle">Docker Ready</text>
    </g>
  </g>
</svg>
