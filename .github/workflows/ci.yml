name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # 编码卫生：拦截 UTF-8 BOM（BOM 会导致 Vite/Vitest 无法解析 package.json）
  encoding:
    name: Encoding (BOM Check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject UTF-8 BOM in tracked files
        run: python3 scripts/check-bom.py

  # 文档一致性：根目录文档与前端内置文档副本必须同步
  docs:
    name: Docs Sync Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check docs are synced
        run: node scripts/sync-docs.js --check

  # 说明：e2e 测试需要真实的 MySQL + MinIO 实例（本地用 docker-compose 启动），
  # 因此 CI 仅运行不依赖外部服务的单元测试；e2e 运行方式见 docs/testing.md。
  backend:
    name: Backend (lint / typecheck / unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter three-model-hub-backend lint

      - name: Typecheck
        run: pnpm --filter three-model-hub-backend exec tsc -p tsconfig.build.json --noEmit

      - name: Unit tests
        run: pnpm --filter three-model-hub-backend test:unit

  frontend:
    name: Frontend (lint / typecheck / unit tests / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter three-model-hub-frontend lint

      - name: Typecheck
        run: pnpm --filter three-model-hub-frontend exec tsc -b --noEmit

      - name: Unit tests
        run: pnpm --filter three-model-hub-frontend test:run

      - name: Build
        run: pnpm --filter three-model-hub-frontend build
