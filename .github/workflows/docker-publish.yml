name: Docker

# 发布策略
#   - push tag v*.*.*  → 构建 amd64 + arm64，推送语义化版本标签与 latest
#   - push master      → 构建 amd64，推送 edge 与 sha-xxxxxxx（不覆盖 latest）
#   - pull_request     → 仅构建 amd64 验证 Dockerfile 可编译，不推送
#   - 手动触发         → 同 tag 行为
#
# 镜像仓库可切换，默认推 ghcr.io。换仓库只需在
#   Settings → Secrets and variables → Actions 里设置：
#     变量 REGISTRY            例如 registry.cn-hangzhou.aliyuncs.com
#     变量 REGISTRY_NAMESPACE  例如 lishuaistart（阿里云 ACR 的命名空间）
#     变量 IMAGE_PREFIX        默认 three-model-hub
#     密钥 REGISTRY_USERNAME   仓库账号
#     密钥 REGISTRY_PASSWORD   仓库口令 / Personal Access Token
# 不设置任何变量时行为与原来一致（ghcr.io + 内置 GITHUB_TOKEN）。
#
# 本地无 CI 也能发镜像：见 scripts/publish-image.sh

on:
  push:
    branches: [master]
    tags: ['v*.*.*']
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.dockerignore'
      - 'backend/Dockerfile'
      - 'frontend/Dockerfile'
      - 'frontend/nginx.conf.template'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ${{ vars.REGISTRY || 'ghcr.io' }}
  IMAGE_NAMESPACE: ${{ vars.REGISTRY_NAMESPACE || github.repository_owner }}
  IMAGE_PREFIX: ${{ vars.IMAGE_PREFIX || 'three-model-hub' }}

jobs:
  build:
    name: ${{ matrix.component }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            dockerfile: backend/Dockerfile
          - component: frontend
            dockerfile: frontend/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # arm64 镜像通过 QEMU 模拟构建，仅发布 tag 时启用
      - name: Set up QEMU
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          # 未配置密钥时回退到 ghcr 的账号 + 内置 token
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_PREFIX }}-${{ matrix.component }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch,prefix=edge-
            type=sha,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
          labels: |
            org.opencontainers.image.title=three-model-hub ${{ matrix.component }}
            org.opencontainers.image.description=全栈 3D 模型管理与场景编排平台
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ startsWith(github.ref, 'refs/tags/') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          build-args: |
            NPM_REGISTRY=${{ vars.NPM_REGISTRY || 'https://registry.npmjs.org' }}

      - name: Summary
        run: |
          {
            echo "### ${{ matrix.component }}"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
